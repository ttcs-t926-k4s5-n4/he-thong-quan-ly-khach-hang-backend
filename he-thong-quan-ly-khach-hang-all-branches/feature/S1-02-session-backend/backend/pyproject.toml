[build-system]
requires=["setuptools>=75"]
build-backend="setuptools.build_meta"
[project]
name="s1-02-session-backend"
version="1.0.0"
requires-python=">=3.11"
dependencies=["Flask>=3.1,<4","Flask-Cors>=5,<6","python-dotenv>=1.0,<2","pyodbc>=5.2,<6"]
[project.optional-dependencies]
dev=["pytest>=8,<9"]
[tool.setuptools.packages.find]
include=["app*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "s1-04-change-password-backend"
version = "1.0.0"
description = "S1-04 change-password REST API for React + Python + SQL Server"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-Cors>=5,<6",
  "python-dotenv>=1.0,<2",
  "pyodbc>=5.2,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "mypy>=1.13,<2",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
